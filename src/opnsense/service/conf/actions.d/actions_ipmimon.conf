[snapshot]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/ipmimon/collector.py
parameters:
type:script_output
message:Read-only IPMI snapshot
cache_ttl:2

[inventory]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/ipmimon/collector.py inventory
parameters:
type:script_output
message:Read-only hardware inventory
cache_ttl:3600

[fan_mode.set]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/ipmimon/fan_control.py
parameters:%s
type:script_output
message:Change IPMI fan mode on supported motherboard
